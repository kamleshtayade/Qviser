[project]
name = "qviser"
version = "0.1.0"
description = "Qviser (Quant + Adviser) is a modular, high-performance Python co-assisting engine designed to support manual, hybrid, and semi-automated quantitative trading workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dhanhq>=2.3.0",
]

[project.scripts]
qviser = "qviser.main:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"